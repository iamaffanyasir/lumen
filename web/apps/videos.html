<!doctype html>
<html lang="en" data-name="Videos" data-color="#ff9f0a" data-logo="video"><head><meta charset="utf-8"><title>Videos · Lumen</title><link rel="stylesheet" href="/s/style.css">
<style>
:root{--v:#ff9f0a;--vbg:#0b0907}
html{background:var(--vbg)}
.wall{--g:radial-gradient(60% 60% at 0% 0%,#4a2a06 0,transparent 70%),var(--vbg)}
.app{position:relative;z-index:1;height:100%;display:flex;flex-direction:column}
.bar{display:flex;align-items:center;gap:1rem;padding:4vh 4.5vw 1vh}
.logo{display:flex;align-items:center;gap:.55em;font-weight:800;font-size:1.5rem}
.logo i{width:1.4em;height:1.4em;background:var(--v);-webkit-mask:url(/s/icons/video.svg) center/contain no-repeat;mask:url(/s/icons/video.svg) center/contain no-repeat}
.bar span{color:var(--mute)}
.hero{height:24vh;padding:0 4.5vw 2.4vh;display:flex;flex-direction:column;justify-content:flex-end}
.hero h1{font-size:2.2rem;font-weight:800;max-width:60vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero p{color:#c4c0b8;margin-top:.6rem}
.view{flex:1;overflow:hidden;min-height:0}
#rows{transition:transform .4s var(--ease);will-change:transform}
.vrow{padding:0 0 3vh}
.vrow h2{padding:0 4.5vw .9vh;font-size:1.12rem;font-weight:700}
.vrow .track{gap:1.2vw;padding:0 4.5vw}
.card{flex:0 0 auto;width:17.6vw;text-align:left;transition:transform .22s var(--ease);will-change:transform;position:relative}
.card .th{position:relative;border-radius:12px;overflow:hidden;aspect-ratio:16/9;background:var(--ph);outline:3px solid transparent;outline-offset:3px;transition:outline-color .15s;display:grid;place-items:center}
.card .th::before{content:"";width:3rem;height:3rem;background:rgba(255,255,255,.7);-webkit-mask:url(/s/icons/video.svg) center/contain no-repeat;mask:url(/s/icons/video.svg) center/contain no-repeat}
.card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.card .pg{position:absolute;left:0;right:0;bottom:0;height:4px;background:rgba(255,255,255,.35)}
.card .pg i{display:block;height:100%;background:var(--v)}
.card .t{padding:.65em .2em 0;font-weight:600;font-size:.92rem;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;opacity:.8;min-height:2.6em;word-break:break-word}
.card small{display:block;color:var(--mute);padding:.25em .2em 0;font-size:.8rem}
.card:focus{transform:scale(1.06);z-index:2}
.card:focus .th{outline-color:#fff}.card:focus .t{opacity:1}
.empty{max-width:720px;margin:10vh auto 0;text-align:center}
.empty h2{font-size:1.7rem}.empty p{color:var(--mute);line-height:1.7;margin:1rem 0 2rem}
.empty code{background:rgba(255,255,255,.08);padding:.15em .5em;border-radius:6px;color:#fff}
.empty .opt:focus{background:#fff;color:#111}
/* player */
#player{position:fixed;inset:0;background:#000;z-index:70;display:none}
#player.on{display:block}
#player video{width:100%;height:100%;object-fit:contain;background:#000}
.osd{position:fixed;left:0;right:0;bottom:0;z-index:71;padding:14vh 5vw 5vh;background:linear-gradient(transparent,rgba(0,0,0,.88));opacity:0;transition:opacity .3s;pointer-events:none}
.osd.on{opacity:1}
.osd h3{font-size:1.7rem;margin-bottom:1.3rem;max-width:80vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pbar{height:6px;border-radius:9px;background:rgba(255,255,255,.25);overflow:hidden}
.pbar i{display:block;height:100%;width:100%;background:var(--v);transform-origin:left;transform:scaleX(0);transition:transform .3s linear}
.ptime{display:flex;justify-content:space-between;margin-top:.6rem;color:#ddd;font-variant-numeric:tabular-nums}
.keys{color:#999;font-size:.85rem;margin-top:.8rem}
.state{position:fixed;left:50%;top:50%;z-index:72;min-width:7vw;height:7vw;padding:0 1.5vw;transform:translate(-50%,-50%) scale(.8);border-radius:99px;background:rgba(0,0,0,.65);display:grid;place-items:center;font-size:2.2vw;font-weight:700;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none}
.state.on{opacity:1;transform:translate(-50%,-50%)}
</style></head>
<body>
<script src="/s/appshell.js"></script>
<div class="wall"></div>
<div class="app">
  <div class="bar"><div class="logo"><i></i>Videos</div><span id="count"></span></div>
  <div class="hero"><h1 id="hT"></h1><p id="hM"></p></div>
  <div class="view"><div id="rows"></div></div>
</div>
<div id="player"><video id="vd" preload="auto"></video></div>
<div class="osd" id="osd"><h3 id="oT"></h3><div class="pbar"><i id="oB"></i></div>
  <div class="ptime"><span id="oN">0:00</span><span id="oD">0:00</span></div>
  <div class="keys">OK: play/pause · ←/→: 10 seconds · ↑/↓: 1 minute · Back: close</div></div>
<div class="state" id="st"></div>
<script src="/s/osd.js"></script>
<script>
const $ = s => document.querySelector(s), R = $('#rows'), vd = $('#vd');
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const enc = p => p.split('/').map(encodeURIComponent).join('/');
const store = { get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch { } } };
const fmt = s => { s = Math.floor(s || 0); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = String(s % 60).padStart(2, '0'); return h ? `${h}:${String(m).padStart(2, '0')}:${x}` : `${m}:${x}`; };
const size = b => b > 1e9 ? (b / 1e9).toFixed(1) + ' GB' : Math.round(b / 1e6) + ' MB';
const hue = s => { let h = 0; for (const c of s) h = (h * 31 + c.charCodeAt(0)) % 360; return h; };
const nice = n => n.replace(/[._]+/g, ' ').replace(/\s+/g, ' ').trim();
let files = [], rowsData = [], cur = null, pos = store.get('vd.pos', {});   // pos: { path: [seconds, length, when] }

function build(roots) {
  if (!files.length) {
    R.innerHTML = `<div class="empty"><h2>No videos yet</h2><p>Copy videos into <code>${esc(roots[0] || '~/Videos')}</code> on the Pi, plug in a USB drive,<br>or upload from your phone: phone remote → More → Add videos.<br>MP4 and WebM play best.</p><div style="display:flex;gap:.8rem;justify-content:center"><button class="opt" onclick="location.reload()">Refresh</button><button class="opt" onclick="lumenExit()">Back to Lumen</button></div></div>`;
    return R.querySelector('.opt').focus();
  }
  $('#count').textContent = `${files.length} video${files.length > 1 ? 's' : ''}`;
  const by = {}; files.forEach(f => (by[f.folder] ||= []).push(f));
  const cont = Object.entries(pos).filter(([p, [s, l]]) => s > 20 && s < l - 30 && files.some(f => f.path === p))
    .sort((a, b) => b[1][2] - a[1][2]).map(([p]) => files.find(f => f.path === p));
  const recent = [...files].sort((a, b) => b.mtime - a.mtime).slice(0, 20);
  rowsData = [{ title: 'Continue watching', items: cont }, ...(files.length > 8 ? [{ title: 'Recently added', items: recent }] : []),
    ...Object.keys(by).sort().map(k => ({ title: k, items: by[k] }))].filter(r => r.items.length);
  R.innerHTML = rowsData.map((row, r) => `<section class="vrow"><h2>${esc(row.title)}</h2><div class="track">${row.items.map((f, i) => {
    const p = pos[f.path], pct = p && p[1] ? Math.min(100, p[0] / p[1] * 100) : 0;
    return `<button class="card" data-r="${r}" data-i="${i}" style="--ph:linear-gradient(135deg,hsl(${hue(f.name)} 45% 28%),hsl(${(hue(f.name) + 50) % 360} 45% 14%));animation:rise .4s var(--ease) backwards;animation-delay:${Math.min(i, 6) * 35}ms">
      <div class="th"><img src="/thumb/${enc(f.path)}" loading="lazy" decoding="async" alt="" onerror="this.remove()">${pct ? `<span class="pg"><i style="width:${pct}%"></i></span>` : ''}</div>
      <div class="t">${esc(nice(f.name))}</div><small>${esc(f.folder)} · ${size(f.size)}${p ? ' · ' + fmt(p[1]) : ''}</small></button>`;
  }).join('')}</div></section>`).join('');
  focusCard(R.querySelector('.card'));
}
const item = c => rowsData[c.dataset.r]?.items[c.dataset.i];
function focusCard(c) {
  if (!c) return;
  c.focus({ preventScroll: true });
  const track = c.parentElement, view = innerWidth, pad = view * .045;
  const x = Math.min(Math.max(0, track.scrollWidth - view), Math.max(0, c.offsetLeft + c.offsetWidth - view + pad * 2));
  track.style.transform = `translateX(${-x}px)`;
  R.style.transform = `translateY(${-track.parentElement.offsetTop}px)`;
  const f = item(c), p = pos[f.path];
  $('#hT').textContent = nice(f.name);
  $('#hM').textContent = [f.folder, size(f.size), p ? (p[0] > 20 && p[0] < p[1] - 30 ? `${fmt(p[1] - p[0])} left` : fmt(p[1])) : ''].filter(Boolean).join('  ·  ');
}

/* player */
const playing = () => $('#player').classList.contains('on');
function save() { if (cur && vd.duration) { pos[cur.f.path] = [Math.floor(vd.currentTime), Math.floor(vd.duration), Date.now()]; store.set('vd.pos', pos); } }
function play(card) {
  const f = item(card); if (!f) return;
  cur = { card, f };
  const p = pos[f.path], at = p && p[0] > 20 && p[0] < p[1] - 30 ? p[0] : 0;   // resume where you left off
  vd.src = '/media/videos/' + enc(f.path) + (at ? '#t=' + at : '');
  vd.play().catch(() => { });
  $('#oT').textContent = nice(f.name); $('#player').classList.add('on'); osd();
}
function close() { save(); window.lumenNP?.(null); vd.pause(); vd.removeAttribute('src'); vd.load(); $('#player').classList.remove('on'); $('#osd').classList.remove('on'); build([]); const c = cur && [...R.querySelectorAll('.card')].find(x => item(x)?.path === cur.f.path); focusCard(c || R.querySelector('.card')); }
function npState() {
  if (!playing() || !cur) return null;
  return { app: 'videos', title: nice(cur.f.name), sub: cur.f.folder, thumb: '/thumb/' + enc(cur.f.path), playing: !vd.paused,
    pos: vd.currentTime || 0, dur: vd.duration || 0, rate: vd.playbackRate, rates: [0.5, 0.75, 1, 1.25, 1.5, 2],
    next: !!cur.card.nextElementSibling, prev: !!cur.card.previousElementSibling, stop: true };
}
const npTick = () => window.lumenNP?.(npState());
setInterval(() => playing() && !vd.paused && npTick(), 2000);
for (const ev of ['play', 'pause', 'seeked', 'loadedmetadata', 'ratechange']) vd.addEventListener(ev, npTick);
function cmd(c, v) {   // commands from the phone remote
  if (!playing()) return;
  if (c === 'toggle') toggle();
  else if (c === 'seek' && vd.duration) { vd.currentTime = Math.max(0, Math.min(vd.duration - 1, +v || 0)); osd(); }
  else if (c === 'skip') seek(+v || 10);
  else if (c === 'next') { const n = cur.card.nextElementSibling; if (n) { save(); focusCard(n); play(n); } }
  else if (c === 'prev') { const p = cur.card.previousElementSibling; if (p) { save(); focusCard(p); play(p); } }
  else if (c === 'rate') { vd.playbackRate = +v || 1; flash(vd.playbackRate + '×'); }
  else if (c === 'stop') close();
}
vd.onended = () => { save(); const n = cur?.card.nextElementSibling; n ? (focusCard(n), play(n)) : close(); };
vd.onerror = () => { if (playing()) { flash("This video format can't play here"); setTimeout(close, 2500); } };
setInterval(() => playing() && !vd.paused && save(), 10000);
let osdT;
const upd = () => { const d = vd.duration || 0; $('#oB').style.transform = `scaleX(${d ? vd.currentTime / d : 0})`; $('#oN').textContent = fmt(vd.currentTime); $('#oD').textContent = fmt(d); };
vd.ontimeupdate = upd;
function osd() { $('#osd').classList.add('on'); upd(); clearTimeout(osdT); osdT = setTimeout(() => !vd.paused && $('#osd').classList.remove('on'), 3500); }
let flT;
function flash(t) { const s = $('#st'); s.textContent = t; s.classList.add('on'); clearTimeout(flT); flT = setTimeout(() => s.classList.remove('on'), t.length > 4 ? 2200 : 600); }
function toggle() { if (vd.paused) { vd.play(); flash('▶'); } else { vd.pause(); flash('❚❚'); } osd(); }
function seek(d) { if (!vd.duration) return; vd.currentTime = Math.min(vd.duration - 1, Math.max(0, vd.currentTime + d)); flash((d > 0 ? '+' : '−') + (Math.abs(d) >= 60 ? '1 min' : Math.abs(d))); osd(); }

addEventListener('keydown', e => {
  const k = e.key, a = document.activeElement;
  const back = k === 'Escape' || k === 'BrowserBack' || k === 'Backspace' || (e.altKey && k === 'ArrowLeft');
  if (playing()) {
    e.preventDefault();
    if (back) close(); else if (k === 'Enter' || k === ' ' || k === 'MediaPlayPause') toggle();
    else if (k === 'ArrowRight') seek(10); else if (k === 'ArrowLeft') seek(-10);
    else if (k === 'ArrowUp') seek(60); else if (k === 'ArrowDown') seek(-60); else osd();
    return;
  }
  if (back) { e.preventDefault(); return lumenExit(); }
  if (!a?.classList.contains('card')) { if (k.startsWith('Arrow')) { e.preventDefault(); const c = R.querySelector('.card'); c ? focusCard(c) : R.querySelector('.opt')?.focus(); } return; }
  const r = +a.dataset.r, i = +a.dataset.i, rows = R.querySelectorAll('.track');
  let t = null;
  if (k === 'ArrowLeft') t = a.previousElementSibling; else if (k === 'ArrowRight') t = a.nextElementSibling;
  else if (k === 'ArrowUp' && rows[r - 1]) { const row = rows[r - 1].children; t = row[Math.min(i, row.length - 1)]; }
  else if (k === 'ArrowDown' && rows[r + 1]) { const row = rows[r + 1].children; t = row[Math.min(i, row.length - 1)]; }
  if (k.startsWith('Arrow')) e.preventDefault();
  if (t) focusCard(t);
});
R.addEventListener('click', e => { const c = e.target.closest('.card'); if (c) { focusCard(c); play(c); } });
$('#player').addEventListener('click', toggle);
$('#player').addEventListener('mousemove', osd);

(function sock() {
  const ws = window.lumenWS = new WebSocket(`ws://${location.host}/ws?tv=1`);
  ws.onopen = () => window.lumenNPResend?.();
  ws.onmessage = e => { const m = JSON.parse(e.data);
    if (m.t === 'cmd') cmd(m.c, m.v);
    if (m.t === 'vol') window.lumenVolume?.(m.v, m.muted);
    if (m.t === 'open' && m.url) { save(); lumenExit(m.url); }
    if (m.t === 'search') location.href = '/s/apps/youtube.html?q=' + encodeURIComponent(m.q); };
  ws.onclose = () => setTimeout(sock, 2000);
})();
fetch('/api/media/videos').then(r => r.json()).then(j => { files = j.files || []; build(j.roots || []); }).catch(() => build([]));
</script>
</body></html>
